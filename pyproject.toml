[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "forgelens"
version = "0.1.0"
description = "Calibrated and explainable document forgery detection research"
requires-python = ">=3.14,<3.15"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy==2.3.2",
  "pydantic==2.13.4",
  "PyYAML==6.0.3",
  "structlog==24.4.0",
  "torch==2.12.1",
  "torchvision==0.27.1",
]

[project.optional-dependencies]
dev = [
  "mypy==1.15.0",
  "pytest==9.1.1",
  "pytest-cov==6.0.0",
  "ruff==0.9.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/forgelens"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["forgelens"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
